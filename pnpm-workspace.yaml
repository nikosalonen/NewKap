# Kap is a single package. This file only holds pnpm settings.

# electron-builder packages a flat node_modules folder, and the app loads
# node_modules/yarn by path to install plugins.
nodeLinker: hoisted

# Yarn 1 never installed missing peer dependencies. Keep the same dependency set.
autoInstallPeers: false

# Packages whose install scripts may run.
allowBuilds:
  # Downloads the ffmpeg binary for this Mac.
  ffmpeg-static: true
  # Its preinstall script only cleans up global Yarn installs.
  yarn: false
  # tsx's compiler. Its postinstall only checks the binary, which pnpm already
  # installs as the optional dependency @esbuild/darwin-arm64.
  esbuild: false

patchedDependencies:
  # Wait up to 30 seconds for recording to start on newer macOS, and resolve as
  # soon as the helper reports the start instead of one second later.
  aperture@6.1.2: patches/aperture@6.1.2.patch

overrides:
  # xo 5 bundles TypeScript 6, while the project builds with TypeScript 5.9.
  # Two TypeScript copies in one lint run can crash type-aware rules (TypeFlags
  # changed in TypeScript 6), so xo uses the project's copy. xo itself only reads
  # the version. Drop this when the project moves to TypeScript 6.
  xo>typescript: $typescript
