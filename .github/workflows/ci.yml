name: CI

on:
  push:
  pull_request:
  # Starts the macOS test job. Use "Run workflow" on the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint and renderer build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Installs the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The install scripts download macOS binaries and build the Swift helper. These checks need neither.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build-renderer

  test-linux:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The project's own postinstall builds the Swift helper, which needs macOS.
      # Run only the steps that download ffmpeg and gifsicle.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm fetch-gifsicle
      - run: pnpm rebuild ffmpeg-static
        env:
          # ffmpeg-static's default release has ffmpeg 7.0.2 for Linux but 6.0
          # for macOS arm64, which Kap bundles. Test against the same 6.0.
          FFMPEG_BINARY_RELEASE: b6.0
      # The tests that need macOS (the Swift helper, clang and lipo) skip themselves.
      - run: pnpm test:main

  test-macos:
    name: Tests (macOS)
    # GitHub often has no free macOS arm64 runner, and a job waiting for one
    # keeps the whole run pending. So this job only runs when started by hand.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Also builds native/build/kap-helper.
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:main
